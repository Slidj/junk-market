<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* --- ПАЛІТРА "COSMIC DEEP" --- */
            --bg-deep: #0f0c29;
            --bg-gradient: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            
            /* Картки - напівпрозорий темний */
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            
            /* Акценти */
            --accent-primary: #f80759; /* Hot Pink */
            --accent-secondary: #bc4e9c; /* Violet */
            --gold-star: #FFD700;
            
            --text-main: #ffffff;
            --text-secondary: #b8b8d9;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-gradient); /* Космічний фон */
            background-attachment: fixed; /* Фон не рухається при скролі */
            color: var(--text-main);
            font-family: 'Outfit', sans-serif; /* Сучасний округлий шрифт */
            padding-bottom: 100px;
            min-height: 100vh;
        }

        /* --- Header (Скло) --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(15, 12, 41, 0.7);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
        }

        .logo {
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Баланс - виглядає як кнопка інтерфейсу зорельота */
        .balance-pill {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--accent-secondary);
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px rgba(188, 78, 156, 0.2);
        }

        .section-title {
            padding: 25px 20px 10px;
            font-size: 13px;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        /* --- Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 20px;
        }

        /* --- Об'ємна картка (Glassmorphism) --- */
        .game-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            /* Тінь створює глибину */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .game-card:active {
            transform: scale(0.96);
        }

        .img-container {
            height: 160px;
            width: 100%;
            position: relative;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Легке затемнення знизу фото, щоб плавно переходило в картку */
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }

        .card-info {
            padding: 10px 15px 15px;
            position: relative;
            z-index: 2;
        }

        .card-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Ціна - яскрава кнопка */
        .price-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 16px;
            font-weight: 900;
            color: var(--gold-star);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); /* Золоте світіння */
        }
        
        .fiat-price {
            display: block;
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* --- Floating Nav --- */
        .nav-container {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 65px;
            /* Скляна панель */
            background: rgba(48, 43, 99, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .nav-icon {
            font-size: 22px;
            color: var(--text-secondary);
            opacity: 0.7;
            transition: 0.3s;
        }

        .nav-icon.active {
            color: #fff;
            opacity: 1;
            text-shadow: 0 0 10px #fff;
        }

        /* Головна кнопка "+" (Градієнтна крапля) */
        .add-btn {
            width: 55px;
            height: 55px;
            /* Яскравий градієнт */
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            box-shadow: 0 5px 20px rgba(248, 7, 89, 0.5); /* Рожеве світіння */
            transform: translateY(-20px);
            border: 3px solid rgba(255,255,255,0.1);
        }
        
        .add-btn:active {
            transform: translateY(-18px) scale(0.95);
        }

    </style>
</head>
<body>

    <header class="header">
        <div class="logo">StarMarket</div>
        <div class="balance-pill">
            <span style="color: var(--gold-star);">★</span> 150
        </div>
    </header>

    <div class="section-title">Fresh Loot 📦</div>

    <main class="grid">
        <div class="game-card">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500">
            </div>
            <div class="card-info">
                <div class="card-title">iPhone 12 Mini</div>
                <div class="price-tag">★ 10,000</div>
                <span class="fiat-price">≈ 6,000 UAH</span>
            </div>
        </div>

        <div class="game-card">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500">
            </div>
            <div class="card-info">
                <div class="card-title">Sony DualSense</div>
                <div class="price-tag">★ 3,500</div>
                <span class="fiat-price">≈ 2,100 UAH</span>
            </div>
        </div>

        <div class="game-card">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500">
            </div>
            <div class="card-info">
                <div class="card-title">Nike Air Max</div>
                <div class="price-tag">★ 2,500</div>
                <span class="fiat-price">≈ 1,500 UAH</span>
            </div>
        </div>

        <div class="game-card">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500">
            </div>
            <div class="card-info">
                <div class="card-title">Polaroid Retro</div>
                <div class="price-tag">★ 1,200</div>
                <span class="fiat-price">≈ 720 UAH</span>
            </div>
        </div>
    </main>

    <nav class="nav-container">
        <div class="nav-icon active">🏠</div>
        <div class="nav-icon">🔍</div>
        <div class="add-btn" onclick="alert('Sell Item')">+</div>
        <div class="nav-icon">🛒</div>
        <div class="nav-icon">👤</div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0f0c29'); // Колір під фон
    </script>
</body>
</html>
