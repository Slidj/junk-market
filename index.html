<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival Shooter</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; background: #000; overflow: hidden; 
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }
        
        /* Повідомлення про поворот екрану */
        #rotate-msg {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #fff;
            z-index: 9999;
            justify-content: center; align-items: center; text-align: center;
            font-family: sans-serif; font-size: 20px;
        }

        /* Показуємо повідомлення тільки у портретному режимі */
        @media screen and (orientation: portrait) {
            #rotate-msg { display: flex; }
        }
    </style>
</head>
<body>

<div id="rotate-msg">🔄 Будь ласка, поверніть телефон<br>горизонтально для гри</div>

<script>
    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        backgroundColor: '#222',
        scale: {
            mode: Phaser.Scale.RESIZE, // Авто-розмір на весь екран
            autoCenter: Phaser.Scale.CENTER_BOTH
        },
        physics: {
            default: 'arcade',
            arcade: { debug: false }
        },
        input: { activePointers: 3 }, // Мультитач
        scene: {
            preload: preload,
            create: create,
            update: update
        }
    };

    const game = new Phaser.Game(config);

    let player, bullets, enemies;
    let lastFired = 0;
    
    // UI Керування
    let joyBase, joyStick, fireBtn;
    let joyPointer = null;
    let isJoyActive = false;
    let isFiring = false;
    
    // Координати джойстиків (оновлюються при ресайзі)
    let joyPos = { x: 120, y: 0 }; 
    let firePos = { x: 0, y: 0 };

    function preload() {
        // Тут нічого не вантажимо, все малюємо кодом в create()
    }

    function create() {
        // --- 1. ГЕНЕРАЦІЯ ГРАФІКИ (Щоб не було зелених квадратів) ---
        generateTextures.call(this);

        // --- 2. СВІТ ---
        // Плитка землі
        this.add.tileSprite(0, 0, 4000, 4000, 'ground_tex');
        this.physics.world.setBounds(0, 0, 3000, 3000);

        // --- 3. ГРАВЕЦЬ ---
        player = this.physics.add.sprite(1500, 1500, 'soldier_tex');
        player.setCollideWorldBounds(true);
        player.body.setCircle(20, 12, 12); // Круглий хітбокс

        // --- 4. КАМЕРА ---
        this.cameras.main.setBounds(0, 0, 3000, 3000);
        this.cameras.main.startFollow(player, true, 0.08, 0.08);
        this.cameras.main.setZoom(1);

        // --- 5. ГРУПИ ОБ'ЄКТІВ ---
        bullets = this.physics.add.group({ defaultKey: 'bullet_tex', maxSize: 50 });
        enemies = this.physics.add.group();

        // Спавнер ворогів
        this.time.addEvent({ delay: 1000, callback: spawnEnemy, callbackScope: this, loop: true });

        // Колізії
        this.physics.add.collider(bullets, enemies, hitEnemy, null, this);
        this.physics.add.collider(player, enemies, hitPlayer, null, this);

        // --- 6. МОБІЛЬНИЙ UI ---
        createControls.call(this);
        updateControlPositions.call(this); // Встановити позиції
        
        // Інструкція на старті
        this.add.text(1500, 1400, 'ЗНИЩУЙ ЗОМБІ!', { fontSize: '32px', fontStyle: 'bold', color: '#fff' }).setOrigin(0.5);
    }

    function update() {
        if (!player.active) return;

        player.body.setVelocity(0);

        // --- ЛОГІКА ДЖОЙСТИКА (ЛІВИЙ ПАЛЕЦЬ) ---
        if (isJoyActive && joyPointer) {
            let dx = joyPointer.x - joyPos.x;
            let dy = joyPointer.y - joyPos.y;
            let angle = Math.atan2(dy, dx);
            let dist = Math.min(Math.sqrt(dx*dx + dy*dy), 60); // Радіус джойстика

            // Візуал
            joyStick.x = joyPos.x + Math.cos(angle) * dist;
            joyStick.y = joyPos.y + Math.sin(angle) * dist;

            // Рух гравця
            const speed = 250;
            player.body.setVelocity(Math.cos(angle) * speed, Math.sin(angle) * speed);
            player.setRotation(angle);
        } else {
            // Повернення джойстика
            if(joyStick) { joyStick.x = joyPos.x; joyStick.y = joyPos.y; }
        }

        // --- ЛОГІКА ВОГНЮ (ПРАВИЙ ПАЛЕЦЬ) ---
        if (isFiring) fireBullet.call(this);

        // --- AI ВОРОГІВ ---
        enemies.children.iterate((enemy) => {
            if (enemy && enemy.active) {
                this.physics.moveToObject(enemy, player, 120);
                enemy.setRotation(Phaser.Math.Angle.Between(enemy.x, enemy.y, player.x, player.y));
            }
        });
    }

    // --- ГЕНЕРАТОР ТЕКСТУР (МАЛЮЄМО САМІ) ---
    function generateTextures() {
        const gfx = this.make.graphics();

        // 1. Солдат (Круг + Плечі + Зброя)
        gfx.clear();
        gfx.fillStyle(0x0088ff, 1); // Синій шолом
        gfx.fillCircle(32, 32, 20);
        gfx.fillStyle(0x004488, 1); // Плечі
        gfx.fillCircle(20, 32, 15);
        gfx.fillCircle(44, 32, 15);
        gfx.fillStyle(0x111111, 1); // Зброя
        gfx.fillRect(40, 26, 30, 12); 
        gfx.generateTexture('soldier_tex', 80, 64);

        // 2. Зомбі (Зелений, рваний)
        gfx.clear();
        gfx.fillStyle(0x00cc00, 1); // Зелений
        gfx.fillCircle(32, 32, 22);
        gfx.fillStyle(0xcc0000, 0.8); // Кров
        gfx.fillCircle(25, 25, 10);
        gfx.fillStyle(0x006600, 1); // Руки
        gfx.fillCircle(10, 20, 12);
        gfx.fillCircle(10, 44, 12);
        gfx.generateTexture('zombie_tex', 64, 64);

        // 3. Куля (Яскрава)
        gfx.clear();
        gfx.fillStyle(0xffff00, 1);
        gfx.fillCircle(8, 8, 6);
        gfx.generateTexture('bullet_tex', 16, 16);

        // 4. Земля (Сітка)
        gfx.clear();
        gfx.fillStyle(0x333333, 1);
        gfx.fillRect(0, 0, 64, 64);
        gfx.lineStyle(2, 0x444444, 1);
        gfx.strokeRect(0, 0, 64, 64);
        gfx.generateTexture('ground_tex', 64, 64);

        gfx.destroy(); // Очищаємо пам'ять
    }

    // --- КЕРУВАННЯ UI ---
    function createControls() {
        // Джойстик (Основа)
        joyBase = this.add.circle(0, 0, 60, 0xffffff).setAlpha(0.2).setScrollFactor(0).setDepth(100);
        // Джойстик (Ручка)
        joyStick = this.add.circle(0, 0, 30, 0x0088ff).setAlpha(0.8).setScrollFactor(0).setDepth(101);

        // Зона джойстика (Ліва половина екрану)
        let joyZone = this.add.rectangle(0, 0, 100, 100, 0x000000, 0).setScrollFactor(0).setInteractive();
        
        // Кнопка вогню
        fireBtn = this.add.circle(0, 0, 45, 0xff0000).setAlpha(0.6).setScrollFactor(0).setDepth(100).setInteractive();
        let fireText = this.add.text(0, 0, '🔥', {fontSize: '30px'}).setOrigin(0.5).setScrollFactor(0).setDepth(101);

        // Події Джойстика
        joyZone.on('pointerdown', (p) => { 
            joyPointer = p; isJoyActive = true; 
            // Джойстик стрибає під палець
            joyPos.x = p.x; joyPos.y = p.y;
            joyBase.x = p.x; joyBase.y = p.y;
        });
        
        this.input.on('pointerup', (p) => { 
            if (p === joyPointer) { isJoyActive = false; joyPointer = null; } 
        });

        // Події Вогню
        fireBtn.on('pointerdown', () => { isFiring = true; fireBtn.setAlpha(1); });
        fireBtn.on('pointerup', () => { isFiring = false; fireBtn.setAlpha(0.6); });
        fireBtn.on('pointerout', () => { isFiring = false; fireBtn.setAlpha(0.6); });

        // Зберігаємо посилання для оновлення позицій
        this.joyZone = joyZone;
        this.fireText = fireText;
    }

    function updateControlPositions() {
        const w = this.scale.width;
        const h = this.scale.height;

        // Позиція джойстика (Ліворуч знизу) - зона реагування
        this.joyZone.setPosition(w / 4, h / 2);
        this.joyZone.setSize(w / 2, h);

        // Позиція за замовчуванням
        joyPos = { x: 120, y: h - 120 };
        joyBase.setPosition(joyPos.x, joyPos.y);
        joyStick.setPosition(joyPos.x, joyPos.y);

        // Позиція кнопки вогню (Праворуч знизу)
        firePos = { x: w - 100, y: h - 100 };
        fireBtn.setPosition(firePos.x, firePos.y);
        this.fireText.setPosition(firePos.x, firePos.y);
    }

    // Ресайз екрану
    window.addEventListener('resize', () => {
        if(game.scene.scenes[0]) {
            game.scene.scenes[0].scale.resize(window.innerWidth, window.innerHeight);
            updateControlPositions.call(game.scene.scenes[0]);
        }
    });

    // --- ІГРОВА ЛОГІКА ---
    function fireBullet() {
        if (this.time.now < lastFired) return;
        lastFired = this.time.now + 100; // Скорострільність

        let bullet = bullets.get(player.x, player.y);
        if (bullet) {
            bullet.setActive(true).setVisible(true);
            let angle = player.rotation;
            
            // Виліт з "дула"
            bullet.setPosition(player.x + Math.cos(angle)*40, player.y + Math.sin(angle)*40);
            
            this.physics.velocityFromRotation(angle, 900, bullet.body.velocity);
            
            // Знищення через 1.5 сек
            this.time.delayedCall(1500, () => {
                if (bullet.active) bullet.setActive(false).setVisible(false);
            });
        }
    }

    function spawnEnemy() {
        if (!player.active) return;
        
        // Спавн навколо гравця
        let angle = Math.random() * Math.PI * 2;
        let dist = 800;
        let x = player.x + Math.cos(angle) * dist;
        let y = player.y + Math.sin(angle) * dist;
        
        // Межі світу
        x = Phaser.Math.Clamp(x, 100, 2900);
        y = Phaser.Math.Clamp(y, 100, 2900);

        let enemy = enemies.create(x, y, 'zombie_tex');
        enemy.setCircle(25);
        enemy.hp = 3;
    }

    function hitEnemy(bullet, enemy) {
        if (bullet.active && enemy.active) {
            bullet.setActive(false).setVisible(false);
            enemy.hp--;
            enemy.setTint(0xff0000);
            this.time.delayedCall(100, () => enemy.clearTint());

            if (enemy.hp <= 0) {
                // Ефект смерті
                this.add.particles(enemy.x, enemy.y, 'zombie_tex', {
                    speed: 100, scale: {start:0.5, end:0}, duration: 300, maxParticles: 5
                });
                enemy.destroy();
            }
        }
    }

    function hitPlayer(player, enemy) {
        this.physics.pause();
        player.setTint(0xff0000);
        this.add.text(player.x, player.y - 100, 'GAME OVER', { fontSize: '40px', color: '#ff0000', fontStyle: 'bold' }).setOrigin(0.5);
    }
</script>
</body>
</html>
