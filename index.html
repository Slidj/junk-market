<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>To The Moon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0b0e11;
            color: white;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header: Balance --- */
        .header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .balance-box {
            background: #1e2329;
            padding: 8px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Roboto Mono', monospace;
            font-size: 18px;
            color: #f0b90b; /* Binance Yellow */
        }

        /* --- Chart Area --- */
        .chart-container {
            flex-grow: 1;
            position: relative;
            background: linear-gradient(180deg, #151a21 0%, #0b0e11 100%);
            border-top: 1px solid #2b3139;
            border-bottom: 1px solid #2b3139;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Поточна ціна (велика цифра) */
        .current-price {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: 'Roboto Mono', monospace;
            font-size: 32px;
            font-weight: 700;
        }
        .price-up { color: #0ecb81; }
        .price-down { color: #f6465d; }

        /* --- Controls --- */
        .controls {
            padding: 20px;
            display: flex;
            gap: 15px;
            background: #0b0e11;
        }

        .btn {
            flex: 1;
            height: 60px;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 900;
            color: white;
            cursor: pointer;
            transition: transform 0.1s;
            text-transform: uppercase;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-up { background-color: #0ecb81; } /* Green */
        .btn-down { background-color: #f6465d; } /* Red */

        /* --- Timer / Status Overlay --- */
        .status-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 16px;
            text-align: center;
            display: none;
            z-index: 10;
            backdrop-filter: blur(5px);
        }
        .status-title { font-size: 14px; color: #848e9c; margin-bottom: 5px; }
        .status-value { font-size: 36px; font-weight: 900; }
        .win { color: #0ecb81; }
        .lose { color: #f6465d; }

        /* Лінія ставки */
        .bet-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            border-top: 2px dashed rgba(255,255,255,0.5);
            pointer-events: none;
            display: none;
        }
        .bet-badge {
            position: absolute;
            right: 10px;
            top: -12px;
            background: #fff;
            color: #000;
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 4px;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: 900; font-size: 20px;">BTC/USD</div>
        <div class="balance-box">
            <span>★</span> <span id="balance">1000</span>
        </div>
    </div>

    <div class="chart-container" id="chartBox">
        <canvas id="chart"></canvas>
        <div class="current-price price-up" id="priceDisplay">45,230.50</div>
        
        <div class="bet-line" id="betLine">
            <div class="bet-badge">ВАША СТАВКА</div>
        </div>

        <div class="status-overlay" id="statusOverlay">
            <div class="status-title" id="statusTitle">RESULT</div>
            <div class="status-value" id="statusValue">WIN</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-up" id="btnUp" onclick="placeBet('up')">ВВЕРХ 📈</button>
        <button class="btn btn-down" id="btnDown" onclick="placeBet('down')">ВНИЗ 📉</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0b0e11');

        // --- Game Config ---
        let balance = 1000;
        const betAmount = 50;
        let currentPrice = 45000;
        let isGameActive = false; // Чи йде раунд
        let betDirection = null; // 'up' або 'down'
        let startPrice = 0; // Ціна на момент ставки

        // --- Elements ---
        const canvas = document.getElementById('chart');
        const ctx = canvas.getContext('2d');
        const priceDisplay = document.getElementById('priceDisplay');
        const balanceEl = document.getElementById('balance');
        const btnUp = document.getElementById('btnUp');
        const btnDown = document.getElementById('btnDown');
        const betLine = document.getElementById('betLine');
        const statusOverlay = document.getElementById('statusOverlay');
        const statusValue = document.getElementById('statusValue');
        const chartBox = document.getElementById('chartBox');

        // --- Chart Data ---
        let prices = [];
        const maxDataPoints = 100; // Скільки точок влазить на екран
        let width, height;

        // Ініціалізація полотна
        function resize() {
            width = canvas.width = chartBox.clientWidth;
            height = canvas.height = chartBox.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Заповнюємо масив початковими даними
        for(let i=0; i<maxDataPoints; i++) {
            prices.push(currentPrice);
        }

        // --- Core Loop (Оновлення графіка) ---
        function updateGame() {
            // 1. Генеруємо нову ціну (Випадкове блукання)
            // Ціна змінюється на випадкову величину від -20 до +20
            const change = (Math.random() - 0.5) * 40; 
            currentPrice += change;
            
            // Додаємо в масив, видаляємо стару
            prices.push(currentPrice);
            if (prices.length > maxDataPoints) prices.shift();

            // 2. Оновлюємо текст ціни
            priceDisplay.innerText = currentPrice.toFixed(2);
            priceDisplay.className = `current-price ${change >= 0 ? 'price-up' : 'price-down'}`;

            // 3. Малюємо графік
            drawChart();

            // 4. Якщо гра активна - перевіряємо умову (таймер тут віртуальний, ми чекаємо 3 сек)
            requestAnimationFrame(updateGame);
        }

        function drawChart() {
            ctx.clearRect(0, 0, width, height);
            
            // Знаходимо мін/макс для масштабування
            const min = Math.min(...prices) - 50;
            const max = Math.max(...prices) + 50;
            const range = max - min;

            ctx.beginPath();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#f0b90b'; // Gold line
            
            // Градієнт під лінією
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, "rgba(240, 185, 11, 0.2)");
            gradient.addColorStop(1, "rgba(240, 185, 11, 0.0)");

            for (let i = 0; i < prices.length; i++) {
                const x = (i / (maxDataPoints - 1)) * width;
                // Нормалізуємо Y: (val - min) / range -> 0..1 -> перевертаємо для canvas
                const y = height - ((prices[i] - min) / range) * height;
                
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            
            ctx.stroke();
            
            // Заливка під графіком
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Пульсуюча точка в кінці
            const lastY = height - ((prices[prices.length-1] - min) / range) * height;
            ctx.beginPath();
            ctx.arc(width, lastY, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
        }

        // --- Betting Logic ---
        function placeBet(direction) {
            if (isGameActive) return; // Не можна ставити під час гри
            if (balance < betAmount) {
                tg.showAlert("Мало зірок!");
                return;
            }

            // Старт раунду
            isGameActive = true;
            betDirection = direction;
            startPrice = currentPrice;
            
            // Списання
            balance -= betAmount;
            balanceEl.innerText = balance;
            
            // UI зміни
            btnUp.disabled = true;
            btnDown.disabled = true;
            statusOverlay.style.display = 'none';
            tg.HapticFeedback.impactOccurred('medium');

            // Показуємо лінію ставки
            // (В реальному коді треба вираховувати Y лінії, але для простоти поставимо її по центру)
            // Для демо просто покажемо, що лінія активна
            betLine.style.display = 'block';
            betLine.style.top = '50%'; 
            betLine.querySelector('.bet-badge').innerText = `СТАРТ: ${startPrice.toFixed(2)}`;
            betLine.querySelector('.bet-badge').style.backgroundColor = direction === 'up' ? '#0ecb81' : '#f6465d';
            betLine.querySelector('.bet-badge').style.color = '#fff';

            // Таймер раунду - 3 секунди
            let timeLeft = 3;
            
            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    finishRound();
                }
            }, 1000);
        }

        function finishRound() {
            const endPrice = currentPrice;
            const won = (betDirection === 'up' && endPrice > startPrice) || 
                        (betDirection === 'down' && endPrice < startPrice);

            let message = "";
            let colorClass = "";

            if (won) {
                const profit = betAmount * 2; // x2
                balance += profit;
                balanceEl.innerText = balance;
                message = `+${profit} ★`;
                colorClass = "win";
                tg.HapticFeedback.notificationOccurred('success');
            } else {
                message = "ВТРАЧЕНО";
                colorClass = "lose";
                tg.HapticFeedback.notificationOccurred('error');
            }

            // Show Result
            statusValue.innerText = message;
            statusValue.className = `status-value ${colorClass}`;
            document.getElementById('statusTitle').innerText = won ? "ПЕРЕМОГА!" : "НЕВДАЧА";
            statusOverlay.style.display = 'block';
            
            // Reset
            betLine.style.display = 'none';
            btnUp.disabled = false;
            btnDown.disabled = false;
            isGameActive = false;
        }

        // Запуск
        updateGame();

    </script>
</body>
</html>
