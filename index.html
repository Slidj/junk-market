<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virus Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #1a1a1a;
            --virus-green: #39ff14; /* Кислотний зелений */
            --virus-purple: #9d00ff; /* Фіолетовий акцент */
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Press Start 2P', cursive; /* Головний шрифт гри */
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* Ефект старого телевізора (Scanlines) */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 999;
        }

        /* --- Header --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px;
            background: var(--bg-color);
            border-bottom: 4px solid var(--virus-green); /* Товста рамка */
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            color: var(--virus-green);
            font-size: 16px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000, -1px -1px 0 #fff; /* Тінь для об'єму */
            line-height: 1.5;
        }

        /* Баланс як у грі (з іконкою) */
        .balance-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #222;
            padding: 8px 12px;
            border: 2px solid var(--virus-purple);
            box-shadow: 4px 4px 0px rgba(157, 0, 255, 0.4); /* Жорстка тінь */
        }

        .balance-text {
            color: #fff;
            font-size: 12px;
        }

        /* --- Grid --- */
        .section-title {
            padding: 25px 15px 10px;
            font-size: 12px;
            color: var(--virus-purple);
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 колонки */
            gap: 15px;
            padding: 15px;
        }

        /* Стиль картки як в грі */
        .game-card {
            background-color: var(--card-bg);
            border: 2px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.1s;
        }

        .game-card:active {
            transform: translateY(4px); /* Ефект натискання кнопки */
        }

        /* Рамка навколо фото */
        .img-frame {
            border-bottom: 2px solid #333;
            padding: 5px;
            background: #000;
        }

        .game-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            /* Легкий фільтр пікселізації (насправді просто різкість) */
            image-rendering: pixelated; 
        }

        .card-info {
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-title {
            font-size: 10px;
            line-height: 1.4;
            color: #ccc;
            height: 28px;
            overflow: hidden;
        }

        .card-price-box {
            background: var(--virus-green);
            color: #000;
            padding: 8px 4px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 3px 3px 0px #000; /* Ретро тінь */
        }

        /* Лейбл "LVL" або категорія */
        .lvl-badge {
            position: absolute;
            top: 5px;
            left: 5px;
            background: var(--virus-purple);
            color: #fff;
            font-size: 8px;
            padding: 4px;
            border: 1px solid #fff;
        }

        /* --- Bottom Menu (Pixel Style) --- */
        .pixel-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            background: #111;
            border: 2px solid var(--text-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            z-index: 100;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 8px;
            color: #666;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--virus-green);
        }

        .nav-icon {
            font-size: 20px;
            /* Імітація піксельних іконок */
            filter: drop-shadow(2px 2px 0px #000); 
        }

        /* Центральна кнопка "+" */
        .add-btn-pixel {
            width: 50px;
            height: 50px;
            background: var(--virus-green);
            color: #000;
            border: 2px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            margin-top: -30px; /* Вилазить вгору */
            box-shadow: 4px 4px 0px #000;
            cursor: pointer;
        }
        
        .add-btn-pixel:active {
            box-shadow: 0px 0px 0px;
            transform: translate(4px, 4px);
        }

        /* --- Modal (Game Pop-up) --- */
        .game-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-box {
            background: var(--bg-color);
            border: 4px solid var(--virus-purple);
            width: 100%;
            max-width: 350px;
            padding: 15px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: -15px;
            right: -15px;
            background: red;
            color: white;
            border: 2px solid #fff;
            width: 30px; height: 30px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
        }

        .modal-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 2px solid #fff;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 14px;
            color: var(--virus-green);
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .modal-price {
            font-size: 20px;
            color: var(--virus-purple);
            margin-bottom: 20px;
            text-align: right;
        }

        .buy-btn {
            width: 100%;
            padding: 15px;
            background: var(--virus-green);
            color: #000;
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            border: none;
            box-shadow: 4px 4px 0px #fff;
            cursor: pointer;
        }
        .buy-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #fff;
        }

    </style>
</head>
