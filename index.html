<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Volume Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0a12;
            --bg-light: #151520;
            --accent: #00f2ff; /* Неоновий блакитний */
            --accent-secondary: #7b00ff; /* Фіолетовий */
            --text-primary: #ffffff;
            --card-radius: 20px;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at top, #1a1a2e, var(--bg-dark));
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            padding-bottom: 100px;
            min-height: 100vh;
        }

        /* --- Header з ефектом скла --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 50;
            /* Ефект матового об'ємного скла */
            background: rgba(21, 21, 32, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-weight: 900;
            font-size: 20px;
            text-transform: uppercase;
            /* Градієнтний текст */
            background: linear-gradient(45deg, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* Об'ємний баланс */
        .balance-pill {
            background: linear-gradient(145deg, #1a1a2e, #0d0d14);
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            /* Внутрішнє світіння та зовнішня тінь для об'єму */
            box-shadow: 
                inset 0 2px 5px rgba(255,255,255,0.1),
                0 5px 15px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            color: #FFD700;
        }

        .section-title {
            padding: 25px 20px 10px;
            font-size: 14px;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        /* --- Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
        }

        /* --- ОБ'ЄМНА КАРТКА ТОВАРУ --- */
        .game-card {
            position: relative;
            border-radius: var(--card-radius);
            overflow: hidden;
            /* Складний фон і тіні для 3D ефекту */
            background: linear-gradient(160deg, #1e1e2f 0%, #12121a 100%);
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.5), /* Глибока тінь знизу */
                inset 0 2px 3px rgba(255,255,255,0.1); /* Верхній блік */
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
        }

        /* Ефект натискання - картка "вдавлюється" */
        .game-card:active {
            transform: scale(0.97);
            box-shadow: 0 5px 10px rgba(0,0,0,0.6);
        }

        .img-container {
            height: 150px;
            width: 100%;
            position: relative;
            /* Внутрішня тінь на фото, ніби воно втоплене в картку */
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.8);
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--card-radius) var(--card-radius) 0 0;
        }

        .card-info {
            padding: 15px;
        }

        .card-title {
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Об'ємна кнопка ціни */
        .price-btn {
            background: linear-gradient(90deg, var(--accent-secondary), var(--accent));
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 14px;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.3); /* Неонове світіння */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* --- Bottom Nav (Плаваюча панель) --- */
        .nav-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 70px;
            /* Дуже об'ємна панель */
            background: rgba(21, 21, 32, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 35px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            box-shadow: 
                0 10px 25px rgba(0,0,0,0.6),
                inset 0 2px 5px rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        .nav-icon {
            font-size: 24px;
            opacity: 0.5;
            transition: 0.3s;
            /* Іконки теж мають об'єм */
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
        }

        .nav-icon.active {
            opacity: 1;
            color: var(--accent);
            filter: drop-shadow(0 0 10px var(--accent));
        }

        /* Центральна кнопка "+" (Найбільш об'ємна) */
        .add-btn-game {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: 300;
            color: #fff;
            box-shadow: 
                0 8px 20px rgba(0, 242, 255, 0.4),
                inset 0 3px 5px rgba(255,255,255,0.3);
            transform: translateY(-15px); /* Піднята над меню */
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        .add-btn-game:active {
            transform: translateY(-12px) scale(0.95);
            box-shadow: 0 4px 10px rgba(0, 242, 255, 0.4);
        }

    </style>
</head>
<body>

    <header class="header">
        <div class="logo">GameMarket</div>
        <div class="balance-pill">
            <span>⭐️</span> 150
        </div>
    </header>

    <div class="section-title">Тренди сезону</div>

    <main class="grid">
        <div class="game-card">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500" alt="iPhone">
            </div>
            <div class="card-info">
                <div class="card-title">iPhone 12 Mini Pro Gamer Edition</div>
                <div class="price-btn">⭐️ 10,000</div>
            </div>
        </div>

        <div class="game-card">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500" alt="Gamepad">
            </div>
            <div class="card-info">
                <div class="card-title">Sony DualSense X</div>
                <div class="price-btn">⭐️ 3,500</div>
            </div>
        </div>

        <div class="game-card">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Sneakers">
            </div>
            <div class="card-info">
                <div class="card-title">Nike Cyber Max</div>
                <div class="price-btn">⭐️ 2,500</div>
            </div>
        </div>

        <div class="game-card">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1616348436168-de43ad0db179?w=500" alt="Phone">
            </div>
            <div class="card-info">
                <div class="card-title">iPhone 13 Obsidian</div>
                <div class="price-btn">⭐️ 15,000</div>
            </div>
        </div>
    </main>

    <nav class="nav-container">
        <div class="nav-icon active">🏠</div>
        <div class="nav-icon">🔥</div>
        <div class="add-btn-game" onclick="alert('Відкрити меню продажу')">+</div>
        <div class="nav-icon">🛒</div>
        <div class="nav-icon">👤</div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        // Встановлюємо колір хедера під наш темний фон
        tg.setHeaderColor('#0a0a12'); 
    </script>
</body>
</html>
