<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virus Market Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=Roboto+Mono:wght@400;700&display=swap');

        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --accent-color: #39ff14; /* Toxic Green */
            --accent-dim: rgba(57, 255, 20, 0.2);
            --text-color: #e0e0e0;
            --border-style: 2px solid var(--accent-color);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Roboto Mono', monospace; /* Шрифт як у терміналі */
            padding-bottom: 90px;
            
            /* Ефект сітки на фоні */
            background-image: 
                linear-gradient(var(--accent-dim) 1px, transparent 1px),
                linear-gradient(90deg, var(--accent-dim) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center top;
        }

        /* --- Header --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(0,0,0,0.9);
            border-bottom: var(--border-style);
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 0 15px var(--accent-color);
        }

        .logo {
            font-family: 'VT323', monospace; /* Піксельний шрифт */
            font-size: 32px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #fff; /* Глітч ефект */
        }

        .balance-box {
            border: 1px solid var(--accent-color);
            background: #000;
            padding: 5px 10px;
            color: var(--accent-color);
            font-weight: 700;
            box-shadow: 0 0 5px var(--accent-color);
        }

        /* --- Grid Title --- */
        .section-title {
            padding: 20px 20px 10px;
            font-size: 14px;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 1px;
        }
        .section-title span {
            color: var(--accent-color);
            margin-right: 5px;
        }

        /* --- Grid --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 великі колонки */
            gap: 15px;
            padding: 15px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid #333;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
        }

        /* Ефект при натисканні */
        .item-card:active {
            transform: scale(0.98);
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-color);
        }

        .img-wrapper {
            width: 100%;
            height: 160px;
            position: relative;
            border-bottom: 1px solid #333;
        }

        .item-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(80%) contrast(120%); /* Робимо фото похмурими */
            transition: filter 0.3s;
        }
        
        /* Коли картка активна, фото стає кольоровим */
        .item-card:active .item-img {
            filter: grayscale(0%);
        }

        .card-info {
            padding: 10px;
        }

        .card-title {
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-price {
            font-family: 'VT323', monospace;
            font-size: 24px;
            color: var(--accent-color);
            text-shadow: 0 0 3px var(--accent-color);
        }

        /* --- Floating Menu (Pixel Style) --- */
        .retro-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: #000;
            border: var(--border-style);
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            box-sizing: border-box;
            box-shadow: 5px 5px 0px rgba(57, 255, 20, 0.3);
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #555;
            font-size: 24px;
            cursor: pointer;
            position: relative;
        }

        .nav-btn.active {
            color: var(--accent-color);
            text-shadow: 0 0 5px var(--accent-color);
        }

        /* Центральна кнопка "+" */
        .center-btn {
            background: var(--accent-color);
            color: #000;
            width: 50px;
            height: 50px;
            margin-top: -35px; /* Виступає вгору */
            border: 2px solid #fff;
            font-size: 30px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px var(--accent-color);
            cursor: pointer;
        }

        /* --- Modal (Terminal Style) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            padding: 20px;
            box-sizing: border-box;
            border: 4px solid var(--accent-color);
        }

        .terminal-header {
            border-bottom: 1px dashed var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        .close-x {
            color: var(--accent-color);
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
        }

        .modal-img {
            width: 100%;
            height: 300px;
            object-fit: contain;
            border: 1px solid #333;
            margin-bottom: 20px;
            background: #050505;
        }

        .terminal-text {
            color: var(--accent-color);
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        
        .buy-btn-pixel {
            width: 100%;
            background: var(--accent-color);
            color: #000;
            font-family: 'VT323', monospace;
            font-size: 28px;
            padding: 10px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px var(--accent-color);
        }

        .buy-btn-pixel:active {
            background: #fff;
            transform: translateY(2px);
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="logo">VIRUS.SHOP</div>
        <div class="balance-box">
            STARS: 150
        </div>
    </div>

    <div class="section-title"><span>></span> SYSTEM_READY...</div>

    <div class="grid">
        <div class="item-card" onclick="openModal('IPHONE_12_MINI', 10000, 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500')">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500" class="item-img">
            </div>
            <div class="card-info">
                <div class="card-title">IPHONE_12_MINI</div>
                <div class="card-price">10,000 *</div>
            </div>
        </div>

        <div class="item-card" onclick="openModal('CYBER_BOOTS', 2500, 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500')">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" class="item-img">
            </div>
            <div class="card-info">
                <div class="card-title">NIKE_AIR_MAX</div>
                <div class="card-price">2,500 *</div>
            </div>
        </div>

        <div class="item-card" onclick="openModal('SONY_AUDIO', 3000, 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500')">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" class="item-img">
            </div>
            <div class="card-info">
                <div class="card-title">HEADPHONES_MK2</div>
                <div class="card-price">3,000 *</div>
            </div>
        </div>

        <div class="item-card" onclick="openModal('RETRO_CAM', 1200, 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500')">
            <div class="img-wrapper">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500" class="item-img">
            </div>
            <div class="card-info">
                <div class="card-title">POLAROID_CAM</div>
                <div class="card-price">1,200 *</div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="terminal-header">
            <span>ITEM_DETAILS.EXE</span>
            <span class="close-x" onclick="closeModal()">[X]</span>
        </div>
        <img id="m-img" src="" class="modal-img">
        <div class="terminal-text">
            ITEM: <span id="m-title" style="color:#fff">...</span><br>
            PRICE: <span id="m-price" style="color:#fff">...</span> STARS<br>
            STATUS: AVAILABLE<br>
            <br>
            > Waiting for user input...
        </div>
        <button class="buy-btn-pixel" onclick="alert('INITIATING TRANSACTION...')">BUY NOW</button>
    </div>

    <div class="retro-nav">
        <button class="nav-btn active">⌂</button>
        <button class="nav-btn">🔍</button>
        <div class="center-btn">+</div>
        <button class="nav-btn">🛒</button>
        <button class="nav-btn">☺</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');

        function openModal(title, price, img) {
            document.getElementById('m-title').innerText = title;
            document.getElementById('m-price').innerText = price;
            document.getElementById('m-img').src = img;
            document.getElementById('modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
