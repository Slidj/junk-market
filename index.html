<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Shooter</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; user-select: none; -webkit-user-select: none; }
        canvas { display: block; touch-action: none; } /* Вимикає зум/скрол браузера */
    </style>
</head>
<body>

<script>
    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        physics: {
            default: 'arcade',
            arcade: { debug: false }
        },
        input: {
            activePointers: 3 // Підтримка мультитачу (2 пальці + миша)
        },
        scene: {
            preload: preload,
            create: create,
            update: update
        }
    };

    const game = new Phaser.Game(config);

    let player;
    let bullets;
    let enemies;
    let lastFired = 0;
    
    // Joystick змінні
    let joyBase, joyStick;
    let isJoyActive = false;
    let joyPointer = null;
    let joyOrigin = {x: 0, y: 0};
    const JOY_RADIUS = 50;
    
    // Кнопка стрільби
    let fireBtn;
    let isFiring = false;

    function preload() {
        // --- ЗАВАНТАЖУЄМО СПРАВЖНІ КАРТИНКИ (З інтернету) ---
        
        // Текстура землі
        this.load.image('ground', 'https://labs.phaser.io/assets/tilemaps/tiles/scifi_platform_tiles_32x32.png');
        
        // Солдат (вигляд зверху)
        this.load.image('soldier', 'https://labs.phaser.io/assets/sprites/topdown-player.png');
        
        // Куля
        this.load.image('bullet', 'https://labs.phaser.io/assets/sprites/bullets/bullet7.png');
        
        // Зомбі (використаємо іншого персонажа як монстра)
        this.load.image('zombie', 'https://labs.phaser.io/assets/sprites/beball1.png');
        
        // Картинки для інтерфейсу (джойстик)
        // Генеруємо їх кодом, щоб не качати зайвого
    }

    function create() {
        // 1. МАПА (Тайлінг)
        // Створюємо нескінченну землю
        this.add.tileSprite(0, 0, 4000, 4000, 'ground');
        this.physics.world.setBounds(0, 0, 2000, 2000);

        // 2. ГРАВЕЦЬ
        player = this.physics.add.sprite(1000, 1000, 'soldier');
        player.setCollideWorldBounds(true);
        // Трохи зменшимо хітбокс, щоб не застрягав
        player.body.setCircle(15, 0, 0); 

        // 3. КАМЕРА
        this.cameras.main.setBounds(0, 0, 2000, 2000);
        this.cameras.main.startFollow(player, true, 0.05, 0.05);
        this.cameras.main.setZoom(1.2); // Трохи наблизимо

        // 4. ВОРОГИ
        enemies = this.physics.add.group();
        // Спавн ворогів
        this.time.addEvent({ delay: 800, callback: spawnEnemy, callbackScope: this, loop: true });

        // 5. КУЛІ
        bullets = this.physics.add.group({
            defaultKey: 'bullet',
            maxSize: 20
        });

        // 6. КОЛІЗІЇ
        this.physics.add.collider(bullets, enemies, hitEnemy, null, this);
        this.physics.add.overlap(player, enemies, hitPlayer, null, this);

        // --- МОБІЛЬНЕ КЕРУВАННЯ (UI) ---
        createMobileControls.call(this);
    }

    function update() {
        if (!player.active) return;

        player.body.setVelocity(0);

        // Логіка джойстика (Рух)
        if (isJoyActive && joyPointer) {
            // Вектор від центру джойстика до пальця
            let dx = joyPointer.x - joyOrigin.x;
            let dy = joyPointer.y - joyOrigin.y;
            
            // Розрахунок кута
            let angle = Math.atan2(dy, dx);
            
            // Обмеження радіусу (щоб "грибок" не вилітав за межі)
            let dist = Math.min(Math.sqrt(dx*dx + dy*dy), JOY_RADIUS);
            
            // Рухаємо графіку джойстика
            joyStick.x = joyBase.x + Math.cos(angle) * dist;
            joyStick.y = joyBase.y + Math.sin(angle) * dist;

            // Рухаємо гравця
            const speed = 200;
            player.body.setVelocity(Math.cos(angle) * speed, Math.sin(angle) * speed);
            
            // Повертаємо гравця в бік руху
            player.setRotation(angle);
        } else {
            // Повертаємо джойстик в центр, якщо відпустили
            if(joyBase && joyStick) {
                joyStick.x = joyBase.x;
                joyStick.y = joyBase.y;
            }
        }

        // Логіка стрільби
        if (isFiring) {
            fireBullet.call(this);
        }

        // Вороги біжать за гравцем
        enemies.children.iterate((enemy) => {
            if (enemy && enemy.active) {
                this.physics.moveToObject(enemy, player, 100);
                enemy.setRotation(Phaser.Math.Angle.Between(enemy.x, enemy.y, player.x, player.y));
            }
        });
    }

    // --- ФУНКЦІЇ КЕРУВАННЯ ---
    function createMobileControls() {
        // Ми малюємо джойстик прямо на екрані
        // Це UI, тому воно має бути поверх гри (ScrollFactor 0)
        
        // 1. Джойстик (Ліворуч)
        const joyX = 100;
        const joyY = window.innerHeight - 100;
        
        // Основа
        joyBase = this.add.circle(joyX, joyY, JOY_RADIUS, 0x888888).setAlpha(0.5).setScrollFactor(0).setDepth(100);
        // Ручка
        joyStick = this.add.circle(joyX, joyY, 25, 0x00ccff).setAlpha(0.8).setScrollFactor(0).setDepth(101);

        // Зона дотику для джойстика (ліва половина екрану)
        const joyZone = this.add.rectangle(window.innerWidth / 4, window.innerHeight / 2, window.innerWidth / 2, window.innerHeight, 0x000000, 0)
            .setScrollFactor(0).setInteractive();

        joyZone.on('pointerdown', (pointer) => {
            joyPointer = pointer;
            isJoyActive = true;
            // Переміщуємо джойстик туди, де натиснули
            joyBase.x = pointer.x;
            joyBase.y = pointer.y;
            joyOrigin = {x: pointer.x, y: pointer.y};
            joyStick.x = pointer.x;
            joyStick.y = pointer.y;
        });

        this.input.on('pointerup', (pointer) => {
            if (pointer === joyPointer) {
                isJoyActive = false;
                joyPointer = null;
                // Повертаємо джойстик на місце за замовчуванням
                joyBase.x = joyX;
                joyBase.y = joyY;
                joyStick.x = joyX;
                joyStick.y = joyY;
            }
        });

        // 2. Кнопка стрільби (Праворуч)
        const fireX = window.innerWidth - 80;
        const fireY = window.innerHeight - 80;

        fireBtn = this.add.circle(fireX, fireY, 40, 0xff0000).setAlpha(0.6).setScrollFactor(0).setDepth(100).setInteractive();
        
        // Іконка на кнопці (просто текст)
        this.add.text(fireX, fireY, 'SHOOT', {fontSize: '14px', fontStyle: 'bold'}).setOrigin(0.5).setScrollFactor(0).setDepth(101);

        fireBtn.on('pointerdown', () => { isFiring = true; fireBtn.setAlpha(1); });
        fireBtn.on('pointerup', () => { isFiring = false; fireBtn.setAlpha(0.6); });
        fireBtn.on('pointerout', () => { isFiring = false; fireBtn.setAlpha(0.6); });
    }

    function fireBullet() {
        if (this.time.now < lastFired) return;
        lastFired = this.time.now + 150;

        let bullet = bullets.get(player.x, player.y);
        if (bullet) {
            bullet.setActive(true).setVisible(true);
            
            // Куля летить туди, куди дивиться гравець
            let angle = player.rotation;
            
            // Трохи зміщуємо спавн кулі вперед, щоб не вилітала з центру тіла
            bullet.x += Math.cos(angle) * 20;
            bullet.y += Math.sin(angle) * 20;

            bullet.setRotation(angle);
            this.physics.velocityFromRotation(angle, 800, bullet.body.velocity);
            
            // Знищити через час
            this.time.delayedCall(1000, () => {
                if (bullet.active) bullet.setActive(false).setVisible(false);
            });
        }
    }

    function spawnEnemy() {
        if (!player.active) return;
        
        let angle = Math.random() * Math.PI * 2;
        let distance = 700;
        let x = player.x + Math.cos(angle) * distance;
        let y = player.y + Math.sin(angle) * distance;
        
        x = Phaser.Math.Clamp(x, 100, 1900);
        y = Phaser.Math.Clamp(y, 100, 1900);

        let enemy = enemies.create(x, y, 'zombie');
        enemy.setTint(0xff0000); // Робимо їх червоними
        enemy.setScale(0.8);
        enemy.body.setCircle(12);
        enemy.hp = 3;
    }

    function hitEnemy(bullet, enemy) {
        if (bullet.active && enemy.active) {
            bullet.setActive(false).setVisible(false);
            enemy.hp--;
            enemy.setAlpha(0.5); // Блимання при попаданні
            this.time.delayedCall(50, () => enemy.setAlpha(1));

            if (enemy.hp <= 0) {
                // Ефект смерті (зменшення)
                this.tweens.add({
                    targets: enemy,
                    scale: 0,
                    duration: 100,
                    onComplete: () => enemy.destroy()
                });
            }
        }
    }

    function hitPlayer(player, enemy) {
        // Простий перезапуск при дотику
        this.scene.restart();
    }

    // Ресайз екрану (поворот телефону)
    window.addEventListener('resize', () => {
        game.scale.resize(window.innerWidth, window.innerHeight);
    });

</script>
</body>
</html>
