<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InstaMarket</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #efeff4);
            --button-color: var(--tg-theme-button-color, #007aff);
            --gray-text: #8e8e93;
            --border-color: rgba(0,0,0,0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 60px; /* Місце для меню */
        }

        /* --- Верхня панель --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: var(--bg-color);
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 22px;
            font-family: 'Segoe UI', cursive; /* Спроба імітувати шрифт Instagram */
        }

        .header-icons {
            display: flex;
            gap: 20px;
            font-size: 24px;
        }

        /* --- Категорії (Стиль Stories) --- */
        .stories-container {
            padding: 10px 0;
            display: flex;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none; /* Приховати скролбар */
        }
        .stories-container::-webkit-scrollbar { display: none; }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 10px;
            min-width: 70px;
            cursor: pointer;
        }

        .story-circle {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); /* Instagram градієнт */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .story-inner {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--bg-color);
            overflow: hidden;
        }
        
        .story-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .story-text {
            font-size: 11px;
            margin-top: 4px;
            color: var(--text-color);
        }

        /* --- Сітка товарів --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 колонки як в Інсті */
            gap: 2px;
            margin-top: 2px;
        }

        .post {
            position: relative;
            aspect-ratio: 1 / 1; /* Квадратні фото */
            background-color: #eee;
            cursor: pointer;
        }

        .post img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .price-tag {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* --- Нижнє меню (Instagram style) --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 50px;
            background-color: var(--bg-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
            z-index: 100;
        }

        .nav-icon {
            font-size: 24px;
            color: var(--text-color);
            cursor: pointer;
        }

        /* Виділення центральної кнопки */
        .nav-icon.add-btn {
            font-size: 30px;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="logo">BaraHolka</div>
        <div class="header-icons">
            <span>❤️</span> <span>💬</span> </div>
    </div>

    <div class="stories-container">
        <div class="story-item">
            <div class="story-circle">
                <div class="story-inner">
                    <img src="https://cdn-icons-png.flaticon.com/512/3050/3050239.png" alt="Phone">
                </div>
            </div>
            <span class="story-text">Техніка</span>
        </div>
        <div class="story-item">
            <div class="story-circle">
                <div class="story-inner">
                    <img src="https://cdn-icons-png.flaticon.com/512/3159/3159614.png" alt="Clothes">
                </div>
            </div>
            <span class="story-text">Одяг</span>
        </div>
        <div class="story-item">
            <div class="story-circle">
                <div class="story-inner">
                    <img src="https://cdn-icons-png.flaticon.com/512/2972/2972048.png" alt="Sport">
                </div>
            </div>
            <span class="story-text">Спорт</span>
        </div>
        <div class="story-item">
            <div class="story-circle">
                <div class="story-inner">
                    <img src="https://cdn-icons-png.flaticon.com/512/862/862032.png" alt="Home">
                </div>
            </div>
            <span class="story-text">Дім</span>
        </div>
        <div class="story-item">
            <div class="story-circle">
                <div class="story-inner">
                    <img src="https://cdn-icons-png.flaticon.com/512/1165/1165187.png" alt="Free">
                </div>
            </div>
            <span class="story-text">Даром</span>
        </div>
    </div>

    <div class="grid" id="grid">
        <div class="post">
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400">
            <div class="price-tag">⭐️ 500</div>
        </div>
        <div class="post">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400">
            <div class="price-tag">⭐️ 120</div>
        </div>
        <div class="post">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400">
            <div class="price-tag">⭐️ 200</div>
        </div>
        <div class="post">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400">
            <div class="price-tag">⭐️ 45</div>
        </div>
        <div class="post">
            <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400">
            <div class="price-tag">⭐️ 80</div>
        </div>
         <div class="post">
            <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=400">
            <div class="price-tag">⭐️ 650</div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-icon">🏠</div> <div class="nav-icon">🔍</div> <div class="nav-icon add-btn" onclick="alert('Відкрити форму продажу')">➕</div> <div class="nav-icon">🛍</div> <div class="nav-icon">👤</div> </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor(tg.themeParams.bg_color); // Колір шапки під колір теми
    </script>
</body>
</html>
