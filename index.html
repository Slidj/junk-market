<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Netflix Market Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Використовуємо темну тему за замовчуванням для ефекту кінотеатру, 
               але змінні Телеграм підтягнуть реальну тему користувача */
            --bg-color: var(--tg-theme-bg-color, #141414); 
            --text-color: var(--tg-theme-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #1f1f1f);
            --button-color: var(--tg-theme-button-color, #E50914); /* Netflix red */
            --border-color: rgba(255,255,255,0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 60px;
        }

        /* --- Верхня панель (спрощена) --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.7) 50%, transparent 100%);
            z-index: 10;
            /* Розмиття фону як в iOS/Netflix */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .logo {
            font-weight: 800;
            font-size: 24px;
            color: var(--button-color); /* Червоний логотип */
            letter-spacing: 1px;
        }
        
        .header-balance {
             font-size: 14px;
             font-weight: 600;
             color: #FFD700;
        }

        /* --- Сітка товарів (Netflix Poster Style) --- */
        .grid-title {
             padding: 10px 20px 5px;
             font-size: 18px;
             font-weight: 700;
        }

        .grid {
            display: grid;
            /* Три колонки, мінімальна ширина 100px, розтягуються */
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px;
            padding: 10px 15px;
        }

        .movie-card {
            position: relative;
            /* Співвідношення сторін для постера (високий прямокутник) */
            aspect-ratio: 2 / 3; 
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.1s;
            background-color: var(--secondary-bg);
        }

        .movie-card:active {
            transform: scale(0.98);
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Градієнт знизу, щоб текст читався */
        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 50%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 10px;
            box-sizing: border-box;
        }

        .card-title {
            color: white;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            /* Обрізка довгого тексту трикрапкою */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-price {
            color: #FFD700; /* Золотий для зірок */
            font-size: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .star-icon {
            width: 14px; height: 14px; fill: #FFD700;
        }


        /* --- Нижнє меню --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 55px;
            background-color: rgba(20, 20, 20, 0.95); /* Майже чорний фон */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        .nav-icon {
            font-size: 24px;
            color: #888;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
        }
        .nav-icon span { font-size: 22px; margin-bottom: 2px; }
        .nav-icon.active { color: white; }

    </style>
</head>
<body>

    <div class="header">
        <div class="logo">BARAHOLKA</div>
        <div class="header-balance">⭐️ 150</div>
    </div>

    <div class="grid-title">Тренди зараз</div>

    <div class="grid" id="grid">
        <div class="movie-card">
            <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=500" alt="Кросівки">
            <div class="card-overlay">
                <div class="card-title">Nike Air Jordan Retro High</div>
                <div class="card-price">
                    <svg class="star-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    500
                </div>
            </div>
        </div>
        <div class="movie-card">
            <img src="https://images.unsplash.com/photo-1616348436168-de43ad0db179?w=500" alt="iPhone">
            <div class="card-overlay">
                <div class="card-title">iPhone 13 Pro Max 256GB</div>
                <div class="card-price">
                    <svg class="star-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    1200
                </div>
            </div>
        </div>
        <div class="movie-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Годинник">
            <div class="card-overlay">
                <div class="card-title">Casio Vintage Silver</div>
                <div class="card-price">
                     <svg class="star-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    45
                </div>
            </div>
        </div>
        <div class="movie-card">
            <img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500" alt="Геймпад">
            <div class="card-overlay">
                <div class="card-title">DualSense PS5 Controller</div>
                <div class="card-price">
                     <svg class="star-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    60
                </div>
            </div>
        </div>
        <div class="movie-card">
            <img src="https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=500" alt="Рюкзак">
            <div class="card-overlay">
                <div class="card-title">Рюкзак міський</div>
                <div class="card-price">
                     <svg class="star-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    30
                </div>
            </div>
        </div>
         <div class="movie-card">
            <img src="https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=500" alt="Фотоапарат">
            <div class="card-overlay">
                <div class="card-title">Canon AE-1 Film Camera</div>
                <div class="card-price">
                     <svg class="star-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    250
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-icon active">
            <span>🏠</span>
            Головна
        </div>
        <div class="nav-icon">
            <span>🔥</span>
            Гаряче
        </div>
        <div class="nav-icon" onclick="alert('Відкрити форму продажу')">
            <span style="font-size: 28px; color: var(--button-color);">⊕</span>
            Продати
        </div>
        <div class="nav-icon">
            <span>🛒</span>
            Кошик
        </div>
        <div class="nav-icon">
            <span>😎</span>
            Профіль
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        // Для Netflix стилю краще примусово задати темний хедер, 
        // або використати прозорий, як зараз в коді.
        // tg.setHeaderColor('#000000'); 
    </script>
</body>
</html>
