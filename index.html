<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket Casino</title>
    <link rel="stylesheet" href="css/style.css?v=35">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div class="header">
        <div class="badge">
            👤 <span id="username">Гравець</span>
        </div>
        <div class="badge">
            <span class="coin">🟡</span> <span id="balance">1000</span>
        </div>
    </div>

    <div id="screen-lobby" class="screen active">
        <div class="logo">POCKET<br>GAME</div>
        <div class="games-list">
            <div class="game-card" onclick="showScreen('screen-slots')">
                <div class="card-icon">🎰</div>
                <div class="card-info"><h3>Neon Slots</h3><p>Classic 5 Reels</p></div>
            </div>
            <div class="game-card" onclick="showScreen('screen-matrix')">
                <div class="card-icon">🧩</div>
                <div class="card-info"><h3>Mega Grid</h3><p>5x3 • Lines</p></div>
            </div>
            <div class="game-card" onclick="showScreen('screen-mines')">
                <div class="card-icon">💣</div>
                <div class="card-info"><h3>Cyber Mines</h3><p>Levels • Risk</p></div>
            </div>
        </div>
    </div>

    <div id="screen-slots" class="screen">
        <button class="btn-3d btn-gray" onclick="showScreen('screen-lobby')">⬅ МЕНЮ</button>
        <div class="slot-frame">
            <div class="slot-window">
                <div id="slot-notif" class="notification-overlay"></div>
                
                <div class="slot-grid">
                    <div class="reel" id="reel1"><div class="reel-strip">🍒</div></div>
                    <div class="reel" id="reel2"><div class="reel-strip">🍋</div></div>
                    <div class="reel" id="reel3"><div class="reel-strip">🍇</div></div>
                    <div class="reel" id="reel4"><div class="reel-strip">💎</div></div>
                    <div class="reel" id="reel5"><div class="reel-strip">7️⃣</div></div>
                </div>
            </div>
        </div>
        <div class="bet-panel">
            <div class="bet-options">
                <button class="btn-3d btn-purple chip" onclick="setSlotBet(10)">10</button>
                <button class="btn-3d btn-purple chip" onclick="setSlotBet(50)">50</button>
                <button class="btn-3d btn-purple chip" onclick="setSlotBet(100)">100</button>
            </div>
            <input type="number" id="slot-bet-input" value="50" class="bet-input" readonly>
        </div>
        <button class="btn-3d spin-btn" onclick="spinSlots()">SPIN</button>
    </div>

    <div id="screen-matrix" class="screen">
        <button class="btn-3d btn-gray" onclick="showScreen('screen-lobby')">⬅ МЕНЮ</button>
        <div class="slot-frame">
            <div class="slot-window matrix-window">
                <div id="matrix-notif" class="notification-overlay"></div>

                <svg id="lines-svg" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
                <div class="matrix-grid">
                    <div class="reel-col" id="m-col1"><div class="sym">🍒</div><div class="sym">🍋</div><div class="sym">🍇</div></div>
                    <div class="reel-col" id="m-col2"><div class="sym">🍒</div><div class="sym">🍋</div><div class="sym">🍇</div></div>
                    <div class="reel-col" id="m-col3"><div class="sym">🍒</div><div class="sym">🍋</div><div class="sym">🍇</div></div>
                    <div class="reel-col" id="m-col4"><div class="sym">🍒</div><div class="sym">🍋</div><div class="sym">🍇</div></div>
                    <div class="reel-col" id="m-col5"><div class="sym">🍒</div><div class="sym">🍋</div><div class="sym">🍇</div></div>
                </div>
            </div>
        </div>
        <div class="lines-panel">
            <div class="lines-buttons">
                <button class="line-btn active" onclick="toggleLine(1)" id="lbtn-1">TOP</button>
                <button class="line-btn" onclick="toggleLine(2)" id="lbtn-2">MID</button>
                <button class="line-btn" onclick="toggleLine(3)" id="lbtn-3">BOT</button>
                <button class="line-btn" onclick="toggleLine(4)" id="lbtn-4">ZIG</button>
                <button class="line-btn" onclick="toggleLine(5)" id="lbtn-5">COMBO</button>
            </div>
        </div>
        <div class="bet-panel">
            <div class="bet-row">
                <label>Ставка на лінію:</label>
                <input type="number" id="matrix-bet-input" class="bet-input-manual" value="10" min="1" oninput="updateMatrixBetDisplay()">
            </div>
            <div class="bet-info-row">
                <span>Лінії: <b id="active-lines-count" style="color:#a78bfa">1</b></span>
                <span>Всього: <b id="total-matrix-bet" style="color:#ffd700">10</b></span>
            </div>
        </div>
        <button class="btn-3d spin-btn" onclick="spinMatrix()">SPIN GRID</button>
    </div>

    <div id="screen-mines" class="screen">
        <button class="btn-3d btn-gray" onclick="exitMines()">⬅ МЕНЮ</button>
        
        <div class="mines-container">
            <div id="mines-notif" class="notification-overlay"></div>
            
            <div class="mines-grid" id="mines-grid"></div>
        </div>

        <div class="bet-panel">
            <div id="mines-controls-start">
                <div class="difficulty-selector">
                    <button class="diff-btn active-easy" onclick="setMineDiff('easy')" id="diff-easy">EASY (3)</button>
                    <button class="diff-btn" onclick="setMineDiff('medium')" id="diff-med">MED (5)</button>
                    <button class="diff-btn" onclick="setMineDiff('hard')" id="diff-hard">HARD (10)</button>
                </div>

                <div class="bet-row">
                    <label>Ставка:</label>
                    <input type="number" id="mines-bet-input" class="bet-input-manual" value="50" min="10">
                </div>
                <button class="btn-3d spin-btn" onclick="startMines()">ГРАТИ</button>
            </div>

            <div id="mines-controls-cashout" style="display:none;">
                <div class="multiplier-display">x<span id="mines-current-mult">1.00</span></div>
                <button class="btn-3d btn-green spin-btn" onclick="cashoutMines()">
                    ЗАБРАТИ <span id="mines-cashout-val">0</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/script.js?v=35"></script>
</body>
</html>
