<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket Casino</title>
    <link rel="stylesheet" href="css/style.css?v=10">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div class="header">
        <div class="badge">👤 <span id="username">Player</span></div>
        <div class="badge"><span class="coin">🟡</span> <span id="balance">1000</span></div>
    </div>

    <div id="screen-lobby" class="screen active">
        <div class="logo">POCKET<br>GAME</div>
        
        <div class="game-card" onclick="showScreen('screen-slots')">
            <div class="card-icon">🎰</div>
            <div class="info">
                <h3 class="card-title">Neon Slots</h3>
                <p class="card-desc">5 Reels • Big Wins</p>
            </div>
        </div>

        <div class="game-card" onclick="showScreen('screen-roulette')">
            <div class="card-icon">🎡</div>
            <div class="info">
                <h3 class="card-title">Roulette</h3>
                <p class="card-desc">Classic Style</p>
            </div>
        </div>
    </div>

    <div id="screen-slots" class="screen">
        <button class="btn-3d btn-gray" onclick="showScreen('screen-lobby')">🏠 MENU</button>
        
        <div class="slot-frame">
            <div class="slot-grid">
                <div class="reel" id="reel1"><div class="reel-strip">🍒</div></div>
                <div class="reel" id="reel2"><div class="reel-strip">🍋</div></div>
                <div class="reel" id="reel3"><div class="reel-strip">🍇</div></div>
                <div class="reel" id="reel4"><div class="reel-strip">💎</div></div>
                <div class="reel" id="reel5"><div class="reel-strip">7️⃣</div></div>
            </div>
        </div>

        <div class="bet-panel">
            <div class="bet-options">
                <button class="btn-3d btn-purple chip" onclick="setSlotBet(10)">10</button>
                <button class="btn-3d btn-purple chip" onclick="setSlotBet(50)">50</button>
                <button class="btn-3d btn-purple chip" onclick="setSlotBet(100)">100</button>
            </div>
            <input type="number" id="slot-bet-input" value="50" class="bet-input">
        </div>

        <button class="btn-3d spin-btn" onclick="spinSlots()">SPIN</button>
        <div id="slot-msg" class="status-text"></div>
    </div>

    <div id="screen-roulette" class="screen">
        <button class="btn-3d btn-gray" onclick="showScreen('screen-lobby')">🏠 MENU</button>
        <h2 style="text-align: center;">Coming Soon</h2>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
