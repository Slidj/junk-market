<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Core</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050505;
            --bar-bg: #1a1a1a;
            --neon-green: #00ff41; /* Hacker Green */
            --neon-red: #ff003c;   /* Cyber Red */
            --neon-blue: #00f3ff;
            --cursor-color: #fff;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Orbitron', sans-serif; /* Футуристичний шрифт */
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* --- Header --- */
        .stats-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .balance { font-size: 20px; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }

        /* --- GAME AREA (The Reactor) --- */
        .reactor-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        .core-visual {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, #222, #000);
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            position: relative;
            transition: all 0.3s;
        }
        
        /* Ефект дихання ядра */
        .core-pulse {
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { box-shadow: 0 0 10px var(--neon-blue); border-color: var(--neon-blue); }
            to { box-shadow: 0 0 30px var(--neon-blue); border-color: #fff; }
        }

        /* --- THE BAR (Target Area) --- */
        .target-bar-frame {
            width: 100%;
            height: 60px;
            background: var(--bar-bg);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            border: 2px solid #333;
            box-shadow: inset 0 0 15px #000;
        }

        /* Зелена зона успіху */
        .success-zone {
            position: absolute;
            top: 0;
            height: 100%;
            background: var(--neon-green);
            opacity: 0.6;
            box-shadow: 0 0 15px var(--neon-green);
        }

        /* Бігунок */
        .cursor {
            position: absolute;
            top: 0;
            width: 6px;
            height: 100%;
            background: #fff;
            box-shadow: 0 0 10px #fff, 0 0 20px var(--neon-blue);
            z-index: 10;
        }

        /* --- CONTROLS --- */
        .control-panel {
            width: 100%;
            text-align: center;
        }

        .info-text {
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .action-btn {
            width: 100%;
            height: 70px;
            border: none;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        /* Стан: ГОТОВИЙ ДО СТАРТУ */
        .btn-start {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue);
        }
        
        /* Стан: ЗУПИНИТИ */
        .btn-stop {
            background: var(--neon-red);
            color: #fff;
            box-shadow: 0 0 30px var(--neon-red);
            animation: shake 0.5s infinite;
        }

        .action-btn:active { transform: scale(0.95); }

        /* Анімація тряски кнопки STOP */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* --- RESULT POPUP --- */
        .result-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            display: none;
            backdrop-filter: blur(5px);
        }
        
        .result-box {
            font-size: 40px;
            font-weight: 900;
            text-shadow: 0 0 20px currentColor;
        }
        .win-text { color: var(--neon-green); }
        .lose-text { color: var(--neon-red); }

    </style>
</head>
<body>

    <div class="stats-bar">
        <div>CORE STATUS: <span id="status-text" style="color:#888">IDLE</span></div>
        <div class="balance">★ <span id="balance">1000</span></div>
    </div>

    <div class="reactor-container">
        <div class="core-visual" id="core">☢</div>
        
        <div class="target-bar-frame" id="frame">
            <div class="success-zone" id="zone"></div>
            <div class="cursor" id="cursor"></div>
        </div>
    </div>

    <div class="control-panel">
        <div class="info-text">BET: 50 ★ | WIN: x2</div>
        <button class="action-btn btn-start" id="mainBtn" onclick="handleBtn()">START</button>
    </div>

    <div class="result-overlay" id="resultOverlay">
        <div class="result-box win-text" id="resultText">STABLE</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#050505');

        // --- Config ---
        let balance = 1000;
        const betCost = 50;
        let isPlaying = false;
        let cursorPosition = 0; // 0 to 100%
        let direction = 1; // 1 = right, -1 = left
        let speed = 1.5; // Швидкість руху (можна збільшувати для складності)
        let animationFrameId;

        // --- Elements ---
        const balanceEl = document.getElementById('balance');
        const mainBtn = document.getElementById('mainBtn');
        const cursor = document.getElementById('cursor');
        const zone = document.getElementById('zone');
        const core = document.getElementById('core');
        const statusText = document.getElementById('status-text');
        const resultOverlay = document.getElementById('resultOverlay');
        const resultText = document.getElementById('resultText');

        // Змінні зони
        let zoneStart = 0; // %
        let zoneWidth = 20; // % (ширина безпечної зони)

        function updateUI() {
            balanceEl.innerText = balance;
        }

        function handleBtn() {
            if (isPlaying) {
                stopGame();
            } else {
                startGame();
            }
        }

        function startGame() {
            if (balance < betCost) {
                tg.showAlert("Мало енергії (зірок)!");
                return;
            }

            // Списання
            balance -= betCost;
            updateUI();
            
            // Скидання стану
            isPlaying = true;
            resultOverlay.style.display = 'none';
            cursorPosition = 0;
            direction = 1;
            
            // Змінюємо кнопку
            mainBtn.innerText = "LOCK";
            mainBtn.className = "action-btn btn-stop"; // Червона кнопка
            
            // Активуємо ядро
            core.classList.add('core-pulse');
            core.style.color = 'var(--neon-blue)';
            statusText.innerText = "UNSTABLE";
            statusText.style.color = "var(--neon-red)";

            // Генеруємо випадкову зону (від 20% до 80%, щоб не було скраю)
            zoneWidth = Math.floor(Math.random() * (25 - 15) + 15); // Ширина від 15 до 25%
            zoneStart = Math.floor(Math.random() * (80 - zoneWidth - 10) + 10);
            
            // Малюємо зону
            zone.style.left = zoneStart + '%';
            zone.style.width = zoneWidth + '%';

            tg.HapticFeedback.impactOccurred('light');

            // Запускаємо цикл
            gameLoop();
        }

        function gameLoop() {
            if (!isPlaying) return;

            // Рухаємо курсор
            cursorPosition += speed * direction;

            // Відбиваємось від країв
            if (cursorPosition >= 100) {
                cursorPosition = 100;
                direction = -1;
            } else if (cursorPosition <= 0) {
                cursorPosition = 0;
                direction = 1;
            }

            // Оновлюємо візуал
            cursor.style.left = cursorPosition + '%';

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function stopGame() {
            isPlaying = false;
            cancelAnimationFrame(animationFrameId);

            // Перевірка влучання
            // Додаємо трохи "поблажки" (hitbox tolerance), бо курсор має ширину
            const hitStart = zoneStart;
            const hitEnd = zoneStart + zoneWidth;

            // Успіх якщо курсор всередині зони
            if (cursorPosition >= hitStart && cursorPosition <= hitEnd) {
                win();
            } else {
                lose();
            }

            // Повертаємо кнопку
            mainBtn.innerText = "START";
            mainBtn.className = "action-btn btn-start";
            
            core.classList.remove('core-pulse');
        }

        function win() {
            const winAmount = betCost * 2;
            balance += winAmount;
            updateUI();

            // Ефекти
            core.style.borderColor = "var(--neon-green)";
            core.style.color = "var(--neon-green)";
            statusText.innerText = "STABILIZED";
            statusText.style.color = "var(--neon-green)";
            
            showPopup("SUCCESS", "win-text");
            tg.HapticFeedback.notificationOccurred('success');
        }

        function lose() {
            // Ефекти
            core.style.borderColor = "var(--neon-red)";
            core.style.color = "var(--neon-red)";
            statusText.innerText = "MELTDOWN";
            statusText.style.color = "var(--neon-red)";

            showPopup("FAILURE", "lose-text");
            tg.HapticFeedback.notificationOccurred('error');
        }

        function showPopup(text, cssClass) {
            resultText.innerText = text;
            resultText.className = "result-box " + cssClass;
            resultOverlay.style.display = 'flex';
            
            // Автоматично сховати через 1.5 сек
            setTimeout(() => {
                resultOverlay.style.display = 'none';
            }, 1500);
        }

    </script>
</body>
</html>
