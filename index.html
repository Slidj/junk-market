<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket Game Casino</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div class="header">
        <div class="user-info">
            👤 <span id="username">Гравець</span>
        </div>
        <div class="balance-box">
            💰 <span id="balance">1000</span>
        </div>
    </div>

    <div id="screen-lobby" class="screen active">
        <h1 style="text-align: center; margin-bottom: 5px;">Pocket Game</h1>
        <p style="text-align: center; color: #888; margin-top: 0;">Твій кишеньковий азарт</p>
        
        <div class="games-grid">
            <div class="game-card" onclick="showScreen('screen-slots')">
                <div class="icon">🎰</div>
                <h3>Слоти</h3>
            </div>
            <div class="game-card" onclick="showScreen('screen-roulette')">
                <div class="icon">🎡</div>
                <h3>Рулетка</h3>
            </div>
        </div>
    </div>

    <div id="screen-slots" class="screen">
        <button class="back-btn" onclick="showScreen('screen-lobby')">⬅ Назад</button>
        <h2 style="text-align: center;">Lucky Slots</h2>
        
        <div class="slot-machine">
            <div class="reel" id="reel1">🍒</div>
            <div class="reel" id="reel2">🍋</div>
            <div class="reel" id="reel3">7️⃣</div>
        </div>

        <div class="controls">
            <label for="slot-bet" style="color: #888; font-size: 0.9rem;">Ваша ставка:</label>
            <input type="number" id="slot-bet" value="50" min="10" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: none; background: #333; color: white; text-align: center; font-weight: bold;">
            
            <button class="action-btn" onclick="spinSlots()">КРУТИТИ</button>
        </div>
        <div id="slot-msg" class="message"></div>
    </div>

    <div id="screen-roulette" class="screen">
        <button class="back-btn" onclick="showScreen('screen-lobby')">⬅ Назад</button>
        <h2 style="text-align: center;">Mini Roulette</h2>
        
        <div class="roulette-container">
            <div class="wheel-pointer"></div>
            <div class="roulette-wheel" id="wheel">
                <div class="wheel-inner">💎</div>
            </div>
        </div>

        <div class="bet-options">
            <button class="bet-color red" onclick="setRouletteBet('red')">🔴 x2</button>
            <button class="bet-color black" onclick="setRouletteBet('black')">⚫ x2</button>
            <button class="bet-color green" onclick="setRouletteBet('green')">🟢 x14</button>
        </div>
        
        <div class="controls">
             <p style="text-align: center; margin: 10px 0;">Ставка на: <span id="current-bet-color" style="font-weight:bold; color:var(--gold-light)">...</span></p>
             <button class="action-btn" onclick="spinRoulette()">КРУТИТИ (50)</button>
        </div>
        <div id="roulette-msg" class="message" style="text-align: center;"></div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
